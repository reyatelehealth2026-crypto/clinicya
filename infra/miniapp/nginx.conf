# infra/miniapp/nginx.conf
#
# Static file server for line-mini-app inside the `next-miniapp` container.
#
# nginx, not `next start`, because line-mini-app/next.config.js sets
# `output: 'export'` — the build emits a plain static `out/` tree and there is
# no Node server to run. `next start` does not even support export output.
#
# Two facts from that config drive everything below (both verified against a
# real build of this repo):
#
#  1. `basePath: '/miniapp'` + `assetPrefix: '/miniapp/'` are baked into the
#     emitted HTML — pages reference /miniapp/_next/static/... — but `out/`
#     itself does NOT contain a miniapp/ directory. Its files are out/index.html,
#     out/shop/index.html, and so on. The Dockerfile therefore copies `out/` TO
#     /usr/share/nginx/html/miniapp/, which makes the on-disk layout line up
#     with the URLs the HTML asks for. No rewrite needed.
#
#  2. `trailingSlash: true` means every route is a directory index
#     (out/shop/index.html), so /miniapp/shop/ resolves via `index`, and
#     /miniapp/shop needs a redirect to the slashed form.
#
# Listens on 3000 because infra/nginx/generate-routes.mjs hardcodes the
# next_miniapp upstream as `next-miniapp:3000`. Changing one without the other
# turns /miniapp into a 502.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The strangler edge terminates TLS and owns the public hostname. Without
    # this, nginx's implicit directory redirect would emit an absolute URL built
    # from this container's own name/port (http://next-miniapp:3000/...) and
    # send the browser somewhere unreachable. Relative redirects stay correct
    # behind any proxy.
    absolute_redirect off;

    # The edge is authoritative for security headers and strips duplicates via
    # proxy_hide_header — so this server deliberately sets none.

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Container-level health check target. Deliberately outside /miniapp so it
    # never collides with an app route, and never proxied by the edge (whose
    # only miniapp rule is `location /miniapp`).
    location = /__miniapp-health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Nothing lives at the container root — this image only serves /miniapp.
    # Without an explicit rule the stock nginx welcome page (which survives
    # replacing conf.d/default.conf, since it ships as a separate file under
    # /usr/share/nginx/html) answers `GET /` with a 200 and leaks the nginx
    # version. The Dockerfile also deletes that file; this is the belt to its
    # braces, and makes the intent explicit for anyone editing later.
    location = / {
        return 404;
    }

    # Content-hashed filenames — safe to cache hard and forever.
    location /miniapp/_next/static/ {
        # ONE Cache-Control header. `expires 1y` emits its own Cache-Control,
        # so pairing it with add_header sends the response twice-headed and
        # leaves which one wins up to the client. Setting the full directive
        # directly is unambiguous.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /miniapp {
        return 308 /miniapp/;
    }

    location /miniapp/ {
        # $uri.html covers any route emitted as a flat file rather than a
        # directory index; the trailing =404 hands control to error_page below.
        try_files $uri $uri/ $uri.html =404;

        # HTML must not be cached: a stale shell would keep pointing at
        # _next chunks that no longer exist after a redeploy.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /miniapp/404.html;
    location = /miniapp/404.html {
        internal;
    }
}
