; infra/php/php.ini
;
; Mirrors the <IfModule mod_php.c> block in the repo root .htaccess so
; behavior is identical to the cPanel/mod_php host (Phase 0 is a lift-and-
; shift — no behavior changes). Loaded as /usr/local/etc/php/conf.d/zz-
; clinicya.ini (zz- prefix => loads after php.ini-production defaults).

display_errors = Off
log_errors = On
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
memory_limit = 256M
date.timezone = "Asia/Bangkok"
; default_charset drives mbstring's internal encoding on PHP 8, so the repo
; .htaccess's `php_value mbstring.internal_encoding "UTF-8"` needs no separate
; mirror here — and must NOT get one: that INI has been deprecated since PHP
; 5.6 and on PHP 8.2 emits a startup deprecation on EVERY invocation — every
; web request, every cron job, every `php -r`. The last one bites hardest,
; because PHP CLI writes notices to STDOUT, so `H=$(docker exec ... php -r ...)`
; captures the warning text along with the value and silently corrupts it.
default_charset = "UTF-8"

; Don't leak PHP version in the X-Powered-By response header.
expose_php = Off

; config/config.php hardcodes DB_HOST to 'localhost', which PDO's mysql
; driver (and mysqli) treat as "connect via unix socket", not TCP, no
; matter what DB_HOST-shaped env vars a container sets. Pointing the
; default socket at a path shared with the `mariadb` compose service (see
; infra/compose/docker-compose.strangler.yml, volume mariadb_socket_phase0)
; is what makes the existing hardcoded config reach the new container with
; zero PHP source changes.
pdo_mysql.default_socket = /run/mysqld/mysqld.sock
mysqli.default_socket = /run/mysqld/mysqld.sock

; --- opcache (plan §2.1: ext list includes opcache) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; validate_timestamps=1 (not 0) during the coexistence/strangler period:
; PHP files are still edited on the shared code volume while both stacks
; run, so we accept the small perf cost of a timestamp check over stale
; opcode caches. Revisit once Phase 13 decommissions PHP.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
