; infra/php/session-redis.ini
;
; Wires infra/php/session-redis-handler.php in on every request via
; auto_prepend_file. The handler itself calls session_set_save_handler()
; before any app script runs, so no `session.save_handler` value is forced
; here — if Redis/Predis aren't reachable yet (e.g. vendor/ not mounted),
; the handler no-ops and PHP quietly keeps its default file-based session
; handler instead of fataling every request.
;
; Runtime knobs (see session-redis-handler.php for defaults):
;   REDIS_SESSION_HOST / REDIS_SESSION_PORT / REDIS_SESSION_PASSWORD
;   REDIS_SESSION_DB       (defaults to logical DB 1 — kept distinct from
;                            the app's REDIS_DB=0 cache namespace)
;   REDIS_SESSION_PREFIX   (defaults to "cny:sess:")
;   SESSION_TTL            (seconds, defaults to 1440 = PHP's stock
;                            session.gc_maxlifetime default)

auto_prepend_file = /opt/clinicya/session-redis-handler.php
