# infra/php/apache-vhost.conf
#
# Replaces the default php:8.2-apache vhost. The base image's global
# `<Directory /var/www/>` block in apache2.conf sets `AllowOverride None`;
# the more-specific `<Directory /var/www/html>` block below overrides that
# for our document root so the existing repo-root .htaccess (clean URLs,
# liff-*.php redirects, debug-script blocking, security headers, mod_php
# ini overrides) keeps working exactly as it does on the cPanel host today
# — no .htaccess changes required.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Config/lock/dotfiles are already denied by .htaccess; belt-and-braces
    # at the Apache level in case a request bypasses rewrite (e.g. a
    # container filesystem quirk during the Phase 0 rehearsal).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "config\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
